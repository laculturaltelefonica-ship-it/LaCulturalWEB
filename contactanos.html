<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contáctanos | Tu Empresa</title>
<link rel="stylesheet" href="style.css">
<style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; padding:20px; }
    .contact-form { max-width:500px; margin: auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    .contact-form h2 { text-align:center; margin-bottom:20px; }
    .contact-form label { display:block; margin-bottom:5px; font-weight:bold; }
    .contact-form input, .contact-form textarea { width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px; }
    .contact-form button { width:100%; padding:10px; background:#007bff; color:#fff; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
    .contact-form button:hover { background:#0056b3; }
</style>
</head>
<body>

<div class="contact-form">
    <h2>Contáctanos</h2>
    <form id="formContacto">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono">

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar</button>
    </form>
</div>

<script>
document.getElementById('formContacto').addEventListener('submit', function(e){
    e.preventDefault();

    // Capturamos los valores
    const nombre = document.getElementById('nombre').value;
    const email = document.getElementById('email').value;
    const telefono = document.getElementById('telefono').value;
    const mensaje = document.getElementById('mensaje').value;

    // Creamos el mensaje para WhatsApp
    const whatsappMsg = `Hola, soy ${nombre}.%0ACorreo: ${email}%0ATeléfono: ${telefono}%0AMensaje: ${mensaje}`;
    const whatsappURL = `https://wa.me/1234567890?text=${whatsappMsg}`; // Cambia el número por tu WhatsApp

    // Creamos el mailto para correo
    const mailtoLink = `mailto:tuemail@dominio.com?subject=Contacto desde web&body=Nombre: ${nombre}%0ACorreo: ${email}%0ATeléfono: ${telefono}%0AMensaje: ${mensaje}`;

    // Abrimos WhatsApp en nueva pestaña
    window.open(whatsappURL, '_blank');

    // Abrimos correo en cliente de email
    window.location.href = mailtoLink;

    // Opcional: limpiar el formulario
    document.getElementById('formContacto').reset();
});
</script>

</body>
</html>
